# Single-container deployment: collector + dashboard in ONE image (see Dockerfile).
# Collector (4448) + dashboard (4447) run under pm2 in one image.
#
#   docker compose -f docker-compose.single.yml up -d --build
#
# This on-prem shape uses network_mode: host because (a) MySQL runs on the host,
# so DB_HOST=localhost in collector/.env reaches it with no MySQL changes, and
# (b) the already-deployed browser extensions post to this host on :4448 directly
# (extension/api.js), which host networking keeps reachable. Requires a Linux host.
#
# For the AWS/Fargate shape instead: drop network_mode: host, publish 4447 only,
# set DB_HOST/FLOOR_MAP_DB_HOST to the RDS endpoint, and repack the extension to
# post same-origin through 4447 (the Next.js rewrites proxy /logs,/ping → 4448).
services:
  web-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-monitor
    container_name: web-monitor
    restart: unless-stopped

    # On-prem deployment server: MySQL runs on the host AND the already-deployed
    # browser extensions post to this host on :4448 directly (extension/api.js).
    # Host networking makes both work with zero MySQL changes — the container
    # shares the host's network stack, so DB_HOST=localhost (from .env) reaches
    # the host MySQL, and both 4447 (dashboard) and 4448 (collector) listen on
    # the host. `ports:` is intentionally omitted (it is ignored under host
    # networking). Requires a Linux host. For the AWS/bridge shape, use the
    # published-port setup instead.
    network_mode: host

    # Secrets + DB config for the collector process (JWT_SECRET, DB_*,
    # FLOOR_MAP_DB_*, SLACK_*, JIRA_*, ARCHIVE_*). PORTs are set per-process in
    # ecosystem.config.js and are intentionally NOT taken from here.
    env_file:
      - ./collector/.env

    # Runtime-mutable state the collector reads/writes. On Fargate these become
    # an EFS mount instead.
    volumes:
      - ./collector/config.json:/app/collector/config.json
      - ./collector/updates:/app/collector/updates
      - ./collector/archives:/app/collector/archives

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4447/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
