<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Agent Browser Monitor</title>
  <style>
    :root {
      --primary: #6a29e1;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #34d399;
      --locked: #334155;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      width: 340px;
      min-height: 400px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 18px;
      margin: 0;
      background: linear-gradient(135deg, #a78bfa, #6a29e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Lock Screen Style */
    #lockScreen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 0;
    }

    .lock-icon {
      width: 64px;
      height: 64px;
      background: rgba(51, 65, 85, 0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      color: var(--text-muted);
    }

    #settingsContainer {
      display: none; /* Hidden until unlocked */
    }

    .card {
      background-color: var(--card);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
      margin-bottom: 16px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field label {
      display: block;
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 6px;
      color: white;
      font-size: 14px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    button.secondary {
      background-color: transparent;
      border: 1px solid var(--text-muted);
      color: var(--text-muted);
      margin-top: 16px;
    }

    .status-badge {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: bold;
    }
    .on { background: rgba(34, 197, 94, 0.2); color: var(--success); }
    .off { background: rgba(239, 68, 68, 0.2); color: var(--danger); }

    .error-msg {
      color: var(--danger);
      font-size: 12px;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Tarro Agent</h1>
    <span id="statusLabel" class="status-badge on">Active</span>
  </div>

  <!-- Locked State View -->
  <div id="lockScreen">
    <div class="lock-icon">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
    </div>
    <div class="field" style="width: 100%;">
      <label>Admin Password Required</label>
      <input type="password" id="unlockPass" placeholder="Enter password to unlock">
      <div id="passError" class="error-msg">Incorrect Password</div>
    </div>
    <button id="unlockBtn">Unlock Settings</button>
  </div>

  <!-- Unlocked Settings View -->
  <div id="settingsContainer">
    <div class="card">
      <div class="field">
        <label>Monitoring Toggle</label>
        <div style="display: flex; align-items: center; justify-content: space-between;">
           <span style="font-size: 14px;">Real-time Enforcement</span>
           <input type="checkbox" id="monitoringToggle" style="width: auto;">
        </div>
      </div>

      <div class="field">
        <label>Machine ID (Manual Override)</label>
        <input type="text" id="machineId">
      </div>

      <div class="field">
        <label>Agent Identification (Read-only Email)</label>
        <input type="text" id="username" readonly style="background: rgba(0,0,0,0.2); color: var(--text-muted);">
      </div>

      <div class="field">
        <label>Violation Policy</label>
        <select id="violationAction">
          <option value="monitor">Log Only (No Action)</option>
          <option value="alert">Show Alert</option>
          <option value="redirect">Redirect to Warning</option>
          <option value="close">Close Tab</option>
        </select>
      </div>

      <div class="field">
        <label>Change Admin Password</label>
        <input type="password" id="newAdminPass" placeholder="Leave blank to keep current">
      </div>

      <button id="saveBtn">Apply & Lock</button>

      <div class="field" style="margin-top: 16px; padding-top: 16px; border-top: 1px solid #334155;">
        <label>Management Engine</label>
        <button id="syncBtn" style="background: var(--locked); font-size: 12px; padding: 8px;">Force Config Sync Now</button>
        <div id="syncStatus" style="font-size: 10px; color: var(--success); text-align: center; margin-top: 4px; display: none;">✓ Settings Updated from Server</div>
      </div>

      <button id="lockBtn" class="secondary">Cancel & Lock</button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
