<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Access Restricted - Internal Policy</title>
  <style>
    body {
      background-color: #0f172a;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .container {
      max-width: 600px;
      padding: 40px;
      background: #1e293b;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }

    .icon-box {
      width: 80px;
      height: 80px;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 24px;
    }

    svg {
      width: 48px;
      height: 48px;
      color: #ef4444;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #f1f5f9;
    }

    p {
      color: #94a3b8;
      line-height: 1.6;
      font-size: 16px;
      margin-bottom: 32px;
    }

    .details {
      background: #0f172a;
      padding: 16px;
      border-radius: 12px;
      font-family: monospace;
      font-size: 14px;
      color: #34d399;
      margin-bottom: 32px;
      border: 1px dashed #334155;
    }

    .btn {
      display: inline-block;
      background: #6a29e1;
      color: white;
      text-decoration: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      transition: transform 0.2s, background 0.2s;
    }

    .btn:hover {
      background: #581cc2;
      transform: translateY(-2px);
    }

    .footer {
      margin-top: 48px;
      font-size: 12px;
      color: #475569;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-box">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
    </div>
    <h1>Access Restricted</h1>
    <p>
      The website you are trying to visit is prohibited under the corporate IT policy. 
      Your attempt has been logged and reported to the system administrator.
    </p>

    <div class="details">
      POLICY_VIOLATION: DOMAIN_BLACKLIST_MATCH<br>
      STATUS: LOGGED_AND_REPORTED
    </div>

    <a href="#" onclick="window.close();" class="btn">Close This Tab</a>

    <div class="footer">
      Tarro Agent &copy; 2026 Internal IT Security
    </div>
  </div>
</body>
</html>
